name: Keep-alive

# Render's free web service sleeps after 15 idle minutes and takes about a minute to wake.
# Pinging every 10 minutes keeps the hosted demo responsive for judges. Runs only once the
# APP_URL repository variable is set (Settings > Secrets and variables > Actions > Variables).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    if: vars.APP_URL != ''
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.APP_URL }}/api/ping"
